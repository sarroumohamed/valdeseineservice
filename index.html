*,::before,::after{box-sizing:border-box}
html,body{margin:0;padding:0}
:root{

}
@supports (color: color-mix(in srgb, red 10%, white)){

}

    --wa:#3DDC7F; --ig:#E27BB5; --fb:#7FB2F0; --tt:#E8E8E6; --star:#EAC26B;
    --shadow:none; --accent-soft:rgba(255,255,255,.07);
    --btn-shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 22px rgba(0,0,0,.45);
  }
  @supports (color: color-mix(in srgb, red 10%, white)){
    :root{ --accent-soft: color-mix(in srgb, var(--accent) 20%, #191919) }
  }
}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Arabic","Noto Sans",Helvetica,Arial,sans-serif;

.action svg{width:22px;height:22px;flex:0 0 22px;color:var(--accent)}
.action .lbl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.action:active{transform:scale(.98)}
.action:last-child:nth-child(odd){grid-column:1 / -1;justify-content:center}

/* ---- ألوان المنصات الحقيقية على الأزرار ---- */
.action.brand{color:#fff;border-color:transparent;box-shadow:var(--btn-shadow);text-shadow:0 1px 1px rgba(0,0,0,.14)}

.action.tt{background:linear-gradient(135deg,#2B2B2B 0%,#101010 100%);box-shadow:var(--btn-shadow),inset 0 0 0 1px rgba(255,255,255,.10)}
.action.th{background:linear-gradient(135deg,#3D3D3D 0%,#141414 100%);box-shadow:var(--btn-shadow),inset 0 0 0 1px rgba(255,255,255,.10)}
.action.star{background:linear-gradient(135deg,#F0AC1E 0%,#D18A0C 55%,#A96D07 100%)}
.action.maps{background:linear-gradient(135deg,#F0655A 0%,#EA4335 45%,#C5221F 100%)}
.action.tel{background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(0,0,0,.16)),var(--accent)}

/* ---- الأقسام ---- */
.sec{padding:26px 20px 0}
.sec h2{margin:0 0 12px;font-size:13px;font-weight:700;color:var(--muted)}
html[dir="ltr"] .sec h2{letter-spacing:.09em;text-transform:uppercase}
.about{margin:0;font-size:15.5px;color:var(--text)}
.list{border:1px solid var(--border);border-radius:12px;overflow:hidden}
.list .row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 15px;border-bottom:1px solid var(--border);font-size:15px}
.list .row:last-child{border-bottom:0}
.price{font-weight:700;white-space:nowrap;color:var(--accent)}
.panel{background:var(--soft);border:1px solid var(--border);border-radius:12px;padding:2px 15px}
.panel .row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--border);font-size:15px}
.panel .row:last-child{border-bottom:0}
.panel .t{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.addr{display:flex;align-items:flex-start;gap:10px;margin-top:12px;font-size:15px;color:var(--muted);text-decoration:none}
.addr svg{width:19px;height:19px;flex:0 0 19px;color:var(--accent);margin-top:2px}
/* معرض بصور كبيرة — صورة واحدة في كل صف */
.gallery{display:grid;grid-template-columns:1fr;gap:16px}
.gallery button{padding:0;border:0;background:var(--soft2);border-radius:16px;overflow:hidden;cursor:pointer;display:block;width:100%;box-shadow:var(--btn-shadow);transition:transform .25s ease;-webkit-tap-highlight-color:transparent}

.gallery.grid img{height:100%;object-fit:cover}

@keyframes riseIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes popIn{0%{opacity:0;transform:scale(.84)}62%{opacity:1;transform:scale(1.035)}100%{opacity:1;transform:scale(1)}}
@keyframes coverIn{from{transform:scale(1.09)}to{transform:scale(1)}}
@keyframes ringPulse{0%{box-shadow:0 0 0 0 rgba(37,211,102,.42)}70%{box-shadow:0 0 0 15px rgba(37,211,102,0)}100%{box-shadow:0 0 0 0 rgba(37,211,102,0)}}
@keyframes sheen{0%{transform:translateX(-150%) skewX(-18deg)}100%{transform:translateX(320%) skewX(-18deg)}}
@keyframes fadeSwap{from{opacity:0}to{opacity:1}}

.anim .rise{opacity:0;animation:riseIn .62s cubic-bezier(.22,.68,.32,1) forwards;animation-delay:var(--d,0ms)}
/* أمان: إن لم تعمل الحركة لأي سبب، يبقى المحتوى مرئياً دائماً */
.anim.done .rise{opacity:1!important;animation:none!important;transform:none!important}
.anim .avatar{animation:popIn .74s cubic-bezier(.2,.8,.25,1) .10s both}
.anim .cover>img,.anim .cover>video{animation:coverIn 1.5s cubic-bezier(.2,.7,.3,1) both}

/* نبضة خفيفة جداً على زر الواتساب لجذب النظر بلطف */
.anim .action.wa::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;animation:ringPulse 4.2s ease-out 2s infinite}
/* لمعة ناعمة تمر على الزر الرئيسي كل بضع ثوانٍ */
.anim .btn::after{content:"";position:absolute;top:0;bottom:0;inset-inline-start:0;width:34%;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(255,255,255,.34),transparent);transform:translateX(-150%) skewX(-18deg);animation:sheen 6s ease-in-out 2.4s infinite}

/* ظهور تدريجي للأقسام أثناء التمرير */
.anim .reveal{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s cubic-bezier(.22,.68,.32,1)}
.anim .reveal.in{opacity:1;transform:none}

/* ظهور أنعم وأطول لصور المعرض مع تقريب خفيف يهدأ تدريجياً */
.anim .gallery .reveal{opacity:0;transform:translateY(34px) scale(.965);transition:opacity .85s ease,transform .95s cubic-bezier(.22,.68,.32,1)}
.anim .gallery .reveal.in{opacity:1;transform:none}
.anim .gallery .reveal img{transform:scale(1.08);transition:transform 1.35s cubic-bezier(.2,.7,.3,1)}
.anim .gallery .reveal.in img{transform:none}

/* تبديل اللغة بانتقال ناعم بدل قفزة */
.swap{animation:fadeSwap .34s ease both}

@media (prefers-reduced-motion: reduce){
  *{transition:none!important}

  .anim .gallery .reveal,.anim .gallery .reveal img{opacity:1!important;transform:none!important;transition:none!important}
  .anim .action.wa::after,.anim .btn::after{animation:none!important;display:none!important}
}

var C = window.CARD, LANGS = ["ar","fr","en"], LABELS = {ar:"ع", fr:"FR", en:"EN"};
var lang = pickLang();
var firstPaint = true;
var MOTION = (C.motion !== false);
var io = null;

function pickLang(){
  var q = (location.search.match(/[?&]lang=(ar|fr|en)/i) || [])[1];      // رابط مباشر بلغة محددة: …/?lang=fr
  if(q) return q.toLowerCase();
  try{ var s = localStorage.getItem("nfc4all-lang"); if(s && UI[s]) return s; }catch(e){}
  if(C.autoDetectLang !== false){
    var n = (navigator.language || "").slice(0,2).toLowerCase();
    if(UI[n]) return n;
  }
  return UI[C.defaultLang] ? C.defaultLang : "ar";
}
function t(v){ if(!v) return ""; return typeof v === "string" ? v : (v[lang] || v.ar || v.fr || v.en || ""); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* مساعدات الحركة: تضيف كلاس التأثير مع تأخير متسلسل */
function riseAttr(delay){ return MOTION ? ' class="rise" style="--d:'+delay+'ms"' : ''; }
function riseOn(cls, delay){ return MOTION ? ' class="'+cls+' rise" style="--d:'+delay+'ms"' : ' class="'+cls+'"'; }
function revealOn(cls){ return MOTION ? ' class="'+cls+' reveal"' : ' class="'+cls+'"'; }
/* يسمح بأسماء ملفات فيها مسافات أو أقواس أو حروف عربية */
function srcU(p){ return esc(encodeURI(String(p))); }

/* هل الغلاف فيديو؟ */
function isVideoFile(p){ return /\.(mp4|webm|mov|m4v|ogv)(\?.*)?$/i.test(String(p||"")); }

/* ---- إصلاح مسارات الصور تلقائياً ----
   المتصفح يجرب بالترتيب: نفس المجلد · img/ · images/ · تغيير jpeg/jpg · حروف كبيرة
   فلو كانت الصور فمجلد img/ أو جنب index.html — فالحالتين كيخدمو */
var IMGALTS = [], imgFails = 0, failTimer = null;
var DEBUG = /[?&]debug=1/.test(location.search);

function altPaths(p){
  var s = String(p || ""), out = [];
  function add(x){ if(x && out.indexOf(x) < 0) out.push(x); }
  var bare = s.replace(/^(?:\.\/)?(?:img|images|photos|assets)\//i, "");
  [s, bare, "img/" + bare, "images/" + bare].forEach(function(b){
    add(b);
    var m = b.match(/^(.*)\.([A-Za-z0-9]+)$/);
    if(!m) return;
    var stem = m[1], ext = m[2].toLowerCase();
    var swap = { jpeg:["jpg","JPEG","JPG"], jpg:["jpeg","JPG","JPEG"], png:["PNG"], webp:["WEBP"] };
    (swap[ext] || []).forEach(function(e){ add(stem + "." + e); });
  });
  return out;
}

/* يبني وسم <img> مع محاولات احتياطية */
function imgTag(p, attrs){
  var alts = altPaths(p);
  var id = IMGALTS.push(alts) - 1;
  return '<img src="' + esc(encodeURI(alts[0])) + '" data-alts="' + id + '" data-step="0" onerror="__imgFix(this)" ' + (attrs || "") + '>';
}

window.__imgFix = function(el){
  var alts = IMGALTS[+el.getAttribute("data-alts")] || [];
  var step = (+el.getAttribute("data-step") || 0) + 1;
  if(step < alts.length){
    el.setAttribute("data-step", step);
    el.src = encodeURI(alts[step]);
    return;
  }
  el.removeAttribute("onerror");
  el.className += " imgfail";
  var b = el.parentNode;
  if(b && b.tagName === "BUTTON") b.className += " failed";
  imgFails++;
  if(window.console) console.warn("[card] صورة ما تلقاتش / image not found:", alts[0]);
  if(DEBUG){
    clearTimeout(failTimer);
    failTimer = setTimeout(function(){ toast(imgFails + " ملف ما تلقاش — شوف Console"); }, 900);
  }
};

function render(){
  var u = UI[lang], html = "";
  document.documentElement.lang = lang;
  document.documentElement.dir  = (lang === "ar") ? "rtl" : "ltr";
  document.title = t(C.name) + " — " + t(C.role);

  /* الغلاف + مبدّل اللغة */
  html += '<div class="cover">';
  if(C.cover){
    if(isVideoFile(C.cover)){
      var pos = C.coverPoster ? ' poster="'+srcU(C.coverPoster)+'"' : '';
      html += '<video'+pos+' data-src="'+srcU(C.cover)+'" muted loop playsinline webkit-playsinline preload="none" disablepictureinpicture></video>';
    } else {
      html += imgTag(C.cover, 'alt="" fetchpriority="high"');
    }
  }
  html += '<div class="langs" role="group" aria-label="Language">';
  LANGS.forEach(function(l){
    html += '<button type="button" data-lang="'+l+'" aria-pressed="'+(l===lang)+'" lang="'+l+'">'+LABELS[l]+'</button>';
  });
  html += '</div></div>';

  /* الرأس */
  html += '<div class="head">';
  var shape = C.logoShape === "circle" ? " circle" : "";
  if(C.logo) html += imgTag(C.logo, 'class="avatar'+shape+'" alt=""');
  else       html += '<div class="avatar mono'+shape+'">'+esc(t(C.name).trim().charAt(0))+'</div>';
  html += '<h1'+riseAttr(170)+'>'+esc(t(C.name))+'</h1>';
  if(t(C.role))    html += '<p'+riseOn("role",220)+'>'+esc(t(C.role))+'</p>';
  if(t(C.tagline)) html += '<p'+riseOn("tag",260)+'>'+esc(t(C.tagline))+'</p>';
  html += '</div>';

  /* الزر الرئيسي */
  html += '<div class="cta"><button'+riseOn("btn",320)+' id="vcf" type="button">'+ICON.save+'<span>'+esc(u.save)+'</span></button></div>';

  /* شبكة الأزرار — كل منصة بلونها */
  var acts = [];
  if(C.whatsapp) acts.push({i:"wa",  c:"wa",   l:u.wa,     h:"https://wa.me/"+C.whatsapp+(t(C.whatsappMsg)?"?text="+encodeURIComponent(t(C.whatsappMsg)):""), x:1});
  if(C.phone)    acts.push({i:"call",c:"tel",  l:u.call,   h:"tel:"+C.phone});
  if(C.phone2)   acts.push({i:"call",c:"tel",  l:(t(C.phone2Label)||u.call2), h:"tel:"+C.phone2});
  if(C.maps)     acts.push({i:"pin", c:"maps", l:u.maps,   h:C.maps, x:1});
  if(C.facebook) acts.push({i:"fb",  c:"fb",   l:u.fb,     h:C.facebook, x:1});
  if(C.instagram)acts.push({i:"ig",  c:"ig",   l:u.ig,     h:C.instagram, x:1});
  if(C.threads)  acts.push({i:"th",  c:"th",   l:u.th,     h:C.threads, x:1});
  if(C.tiktok)   acts.push({i:"tt",  c:"tt",   l:u.tt,     h:C.tiktok, x:1});
  if(C.email)    acts.push({i:"mail",c:"mail", l:u.mail,   h:"mailto:"+C.email});
  if(C.website)  acts.push({i:"globe",c:"web", l:u.web,    h:C.website, x:1});
  (C.extraLinks||[]).forEach(function(e){ if(e && e.url) acts.push({i:e.icon||"globe", c:"web", l:t(e.label), h:e.url, x:1}); });
  if(C.review)   acts.push({i:"star",c:"star", l:u.review, h:C.review, x:1});

  if(acts.length){
    html += '<div class="actions">';
    acts.forEach(function(a, idx){
      var cls = "action brand " + a.c + (MOTION ? " rise" : "");
      var st  = MOTION ? ' style="--d:'+(380 + idx*70)+'ms"' : '';
      html += '<a class="'+cls+'"'+st+' href="'+esc(a.h)+'"'+(a.x?' target="_blank" rel="noopener"':'')+'>'+ICON[a.i]+'<span class="lbl">'+esc(a.l)+'</span></a>';
    });
    html += '</div>';
  }

  /* نبذة */
  if(t(C.about)) html += '<section'+revealOn("sec")+'><h2>'+esc(u.about)+'</h2><p class="about">'+esc(t(C.about))+'</p></section>';

  /* الخدمات */
  if(C.services && C.services.length){
    html += '<section'+revealOn("sec")+'><h2>'+esc(u.services)+'</h2><div class="list">';
    C.services.forEach(function(s){
      html += '<div class="row"><span>'+esc(t(s.label))+'</span></div>';
    });
    html += '</div></section>';
  }

  /* المعرض */
  if(C.gallery && C.gallery.length){
    var gstyle = (C.galleryStyle === "grid") ? "grid" : "large";
    html += '<section'+revealOn("sec")+'><h2>'+esc(u.work)+'</h2><div class="gallery '+gstyle+'">';
    C.gallery.forEach(function(g, i){
      var gc = MOTION ? ' class="reveal"' : '';
      var eager = i < 2 ? ' fetchpriority="high"' : ' loading="lazy" fetchpriority="low"';
      html += '<button type="button"'+gc+' aria-label="'+esc(u.work)+' '+(i+1)+'">'+imgTag(g, 'alt=""'+eager+' decoding="async"')+'</button>';
    });
    html += '</div></section>';
  }

  /* الأوقات + العنوان */
  if((C.hours && C.hours.length) || t(C.address)){
    var hasHours = !!(C.hours && C.hours.length);
    html += '<section'+revealOn("sec")+'><h2>'+esc(hasHours ? u.hours : u.location)+'</h2>';
    if(C.hours && C.hours.length){
      html += '<div class="panel">';
      C.hours.forEach(function(h){
        html += '<div class="row"><span>'+esc(t(h.label))+'</span><span class="t" dir="ltr">'+esc(h.time)+'</span></div>';
      });
      html += '</div>';
    }
    if(t(C.address)){
      var ah = C.maps ? '<a class="addr" href="'+esc(C.maps)+'" target="_blank" rel="noopener">' : '<div class="addr">';
      html += ah + ICON.pin + '<span>'+esc(t(C.address))+'</span>' + (C.maps ? '</a>' : '</div>');
    }
    html += '</section>';
  }

  /* مشاركة + تذييل */
  html += '<div'+revealOn("sec")+'><button class="share" id="shr" type="button">'+ICON.share+'<span>'+esc(u.share)+'</span></button></div>';
  html += '<div'+revealOn("foot")+'>'+esc(u.by)+' <a href="'+esc(C.brand.url)+'" target="_blank" rel="noopener">'+esc(C.brand.name)+'</a></div>';

  var cardEl = document.getElementById("card");
  cardEl.className = "card" + (MOTION ? " anim" : "");
  cardEl.innerHTML = html;

  if(MOTION && !firstPaint){
    cardEl.classList.add("swap");
    setTimeout(function(){ cardEl.classList.remove("swap"); }, 400);
  }
  firstPaint = false;

  if(MOTION){
    cardEl.classList.remove("done");
    setTimeout(function(){ cardEl.classList.add("done"); }, 2800);
  }

  bind();
  observeReveals();

  /* ---- فيديو الغلاف — تحميل متأخر باش الصفحة تفتح بزربة ----
     1. الصورة (poster) كتبان فوراً
     2. الفيديو كيبدا يتحمل غير منين تكمل الصفحة
     3. فالشبكة الضعيفة (2G / Save-Data) كيتسنا و كتبقى غير الصورة */
  var vid = cardEl.querySelector(".cover video");
  if(vid){
    vid.addEventListener("error", function(){
      if(window.console) console.warn("[card] فيديو الغلاف ما تلقاش:", C.cover);
      if(!C.coverPoster) vid.parentNode.className += " empty";
    });
    var cn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
    var slow = !!(cn && (cn.saveData === true || /(^|-)(2g|slow-2g)$/i.test(cn.effectiveType || "")));
    if(slow){
      if(window.console) console.info("[card] شبكة ضعيفة — الفيديو ما تحملش");
    } else {
      var startVideo = function(){
        if(vid.getAttribute("src")) return;
        vid.setAttribute("src", vid.getAttribute("data-src"));
        vid.setAttribute("autoplay", "");
        var pr = vid.play && vid.play();
        if(pr && pr.catch) pr.catch(function(){});
      };
      if(document.readyState === "complete") setTimeout(startVideo, 80);
      else window.addEventListener("load", function(){ setTimeout(startVideo, 80); });
    }
  }
}

/* ظهور الأقسام تدريجياً عند التمرير */
function observeReveals(){
  var items = document.querySelectorAll(".reveal");
  if(!MOTION || !items.length) return;
  if(!("IntersectionObserver" in window)){
    items.forEach(function(el){ el.classList.add("in"); });
    return;
  }
  if(io) io.disconnect();
  io = new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if(en.isIntersecting){ en.target.classList.add("in"); io.unobserve(en.target); }
    });
  }, { rootMargin: "0px 0px -8% 0px", threshold: 0.06 });
  items.forEach(function(el){ io.observe(el); });
}

function bind(){
  document.querySelectorAll(".langs button").forEach(function(b){
    b.addEventListener("click", function(){
      lang = b.getAttribute("data-lang");
      try{ localStorage.setItem("nfc4all-lang", lang); }catch(e){}
      render(); window.scrollTo(0,0);
    });
  });
  document.querySelectorAll(".gallery button").forEach(function(b){
    b.addEventListener("click", function(){ openLb((b.querySelector("img")||{}).currentSrc || (b.querySelector("img")||{}).src); });
  });
  document.getElementById("vcf").addEventListener("click", saveContact);
  document.getElementById("shr").addEventListener("click", shareCard);
}

/* --- حفظ جهة الاتصال (ملف vCard) --- */
function saveContact(){
  var v = C.vcard || {}, fn = t(C.name);
  var lines = [];
  lines.push("BEGIN:VCARD");
  lines.push("VERSION:3.0");
  var lastName = v.lastName || fn;
  var firstName = v.firstName || "";
  lines.push("N:" + lastName + ";" + firstName + ";;;");
  var fullName = (firstName ? firstName + " " : "") + lastName;
  lines.push("FN:" + fullName);
  if (v.org) lines.push("ORG:" + v.org);
  if (v.title) lines.push("TITLE:" + v.title);
  if (C.phone) lines.push("TEL;TYPE=CELL:" + C.phone);
  if (C.email) lines.push("EMAIL;TYPE=INTERNET:" + C.email);
  if (C.website) lines.push("URL:" + C.website);
  var addr = t(C.address) || "";
  var city = v.city || "";
  var country = v.country || "";
  if (addr || city || country) {
    lines.push("ADR;TYPE=WORK:;;" + addr + ";" + city + ";;;" + country);
  }
  lines.push("URL;TYPE=card:" + location.href);
  lines.push("NOTE:" + t(C.role));
  lines.push("END:VCARD");

  var blob = new Blob([lines.join("\r\n")], { type: "text/vcard;charset=utf-8" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = (fullName.replace(/[^\w\u0600-\u06FF -]/g, "") || "contact") + ".vcf";
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1200);
}

/* --- مشاركة --- */
function shareCard(){
  var d = { title: t(C.name), text: t(C.role), url: location.href };
  if(navigator.share){ navigator.share(d).catch(function(){}); return; }
  if(navigator.clipboard){ navigator.clipboard.writeText(location.href).then(function(){ toast(UI[lang].copied); }); }
}

/* --- المعرض المكبّر --- */
var lb = document.getElementById("lb"), lbi = document.getElementById("lbi");
function openLb(src){ lbi.src = src; lb.classList.add("on"); }
function closeLb(){ lb.classList.remove("on"); lbi.src = ""; }
lb.addEventListener("click", closeLb);
document.addEventListener("keydown", function(e){ if(e.key === "Escape") closeLb(); });

/* --- تنبيه --- */
var tEl = document.getElementById("toast"), tTimer;
function toast(msg){
  tEl.textContent = msg; tEl.classList.add("on");
  clearTimeout(tTimer); tTimer = setTimeout(function(){ tEl.classList.remove("on"); }, 2200);
}

/* --- إقلاع --- */
if(C.accent){
  document.documentElement.style.setProperty("--accent", C.accent);
  var m = document.createElement("meta"); m.name = "theme-color"; m.content = C.accent;
  document.head.appendChild(m);
}
render();
})();
</script>
